---
# OpenAPI documents lean on compact flow mappings ({ type: string }) to stay
# readable at depth, and carry long description strings. Both are deliberate.
extends: default

rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  line-length:
    max: 100
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  comments:
    min-spaces-from-content: 1
  document-start:
    present: false
  truthy:
    check-keys: false
