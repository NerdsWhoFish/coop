openapi: 3.1.0

info:
  title: Coop API
  version: 0.1.0
  description: |
    Coop is a self-hosted, parent-curated YouTube for kids.

    This document is the contract between the Go backend and the two native
    clients. The Swift client is generated from it, and the server is tested
    against it so drift fails before release rather than at runtime.

    Two disjoint surfaces share one server:

    - `/api/v1/parent` requires a parent session. Parents scoped to specific
      children receive 404 rather than 403 for children outside their scope, so
      the response does not confirm that another child exists.
    - `/api/v1/child` requires a paired device token. It is read-mostly: a child
      can read their own feed, record local reactions and watch progress, and
      raise a request. Nothing on this surface can change policy.
  license:
    name: MIT
    url: https://github.com/nerdswhofish/coop/blob/main/LICENSE

servers:
  - url: "{publicUrl}/api/v1"
    description: A family's own instance
    variables:
      publicUrl:
        default: https://coop.example

tags:
  - name: parent-auth
  - name: family
  - name: children
  - name: pairing
  - name: allowlist
  - name: keywords
  - name: requests
  - name: suppressions
  - name: child-session
  - name: child-browse
  - name: child-activity
  - name: system

security:
  - parentSession: []

paths:
  /setup:
    get:
      operationId: getSetupStatus
      tags: [parent-auth]
      summary: Report whether first-run setup is available
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
    post:
      operationId: setUpFamily
      tags: [parent-auth]
      summary: Create the first family and admin
      description: Refused once any family exists on the instance.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Family created; TOTP enrollment is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthChallenge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409":
          description: The instance is already configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness and database reachability
      security: []
      responses:
        "200": { description: Healthy }
        "503": { description: Database unreachable }

  # Parent authentication ----------------------------------------------------

  /parent/auth/login:
    post:
      operationId: logInParent
      tags: [parent-auth]
      summary: Exchange credentials for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Password accepted; TOTP verification is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /parent/auth/invitation:
    post:
      operationId: acceptParentInvitation
      tags: [parent-auth]
      summary: Accept a single-use parent invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              properties:
                code: { type: string }
                password: { type: string, format: password }
      responses:
        "201":
          description: Parent created; TOTP enrollment is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /parent/auth/totp/verify:
    post:
      operationId: verifyParentTOTP
      tags: [parent-auth]
      summary: Complete parent authentication with TOTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /parent/me:
    get:
      operationId: getCurrentParent
      tags: [parent-auth]
      summary: The signed-in parent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /parent/audit:
    get:
      operationId: listAuditEvents
      tags: [family]
      summary: List retained policy changes visible to this parent
      parameters:
        - name: before
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Newest events first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }

  # Family -------------------------------------------------------------------

  /parent/family:
    get:
      operationId: getFamily
      tags: [family]
      summary: Read family settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
    patch:
      operationId: updateFamily
      tags: [family]
      summary: Update family settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                timezone: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteFamily
      tags: [family]
      summary: Permanently delete the family and every account and child record
      description: Admin only. This operation cannot be undone.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/family/api-key:
    put:
      operationId: setFamilyAPIKey
      tags: [family]
      summary: Set the family's YouTube Data API key
      description: |
        Admin only. The key is validated against YouTube before it is stored,
        then encrypted at rest. It is never returned by any endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey: { type: string }
      responses:
        "204": { description: Stored }
        "400":
          description: The key was rejected by YouTube
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/family/quota:
    get:
      operationId: getFamilyQuota
      tags: [family]
      summary: Today's API spend against each budget
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuotaStatus" }

  # Parents ------------------------------------------------------------------

  /parent/parents:
    get:
      operationId: listParents
      tags: [family]
      summary: List parents. Admin only
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Parent" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/parents/invite:
    post:
      operationId: inviteParent
      tags: [family]
      summary: Create a single-use invitation. Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, childIds]
              properties:
                email: { type: string, format: email }
                role:
                  type: string
                  enum: [admin, parent]
                  default: parent
                childIds:
                  type: array
                  description: Children this parent may manage. Must be empty for admins.
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/parents/{parentId}:
    parameters:
      - $ref: "#/components/parameters/ParentId"
    delete:
      operationId: deleteParent
      tags: [family]
      summary: Remove a parent. Admin only
      description: Removing the last admin is refused, since nothing could restore access.
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Would leave the family with no admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /parent/parents/{parentId}/scope:
    parameters:
      - $ref: "#/components/parameters/ParentId"
    put:
      operationId: setParentScope
      tags: [family]
      summary: Replace which children a parent may manage. Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childIds]
              properties:
                childIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }

  # Children -----------------------------------------------------------------

  /parent/children:
    get:
      operationId: listChildren
      tags: [children]
      summary: List children in scope
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Child" }
    post:
      operationId: createChild
      tags: [children]
      summary: Create a child profile. Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                avatarId: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Child" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/children/{childId}:
    parameters:
      - $ref: "#/components/parameters/ChildId"
    get:
      operationId: getChild
      tags: [children]
      summary: Read one child
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Child" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateChild
      tags: [children]
      summary: Update a child's settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildSettings" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Child" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteChild
      tags: [children]
      summary: Delete a child and everything belonging to them. Admin only
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/children/{childId}/recommendations:
    parameters:
      - $ref: "#/components/parameters/ChildId"
    get:
      operationId: getChildRecommendations
      tags: [children]
      summary: Preview the child's explainable local recommendations
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /parent/children/{childId}/channel-weights:
    parameters:
      - $ref: "#/components/parameters/ChildId"
    get:
      operationId: getChildChannelWeights
      tags: [children]
      summary: Read non-neutral channel preferences for a child's feed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelWeight" }

  /parent/children/{childId}/channel-weights/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChildId"
      - $ref: "#/components/parameters/ChannelId"
    put:
      operationId: setChildChannelWeight
      tags: [children]
      summary: Set a soft channel preference without blocking the channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weight]
              properties:
                weight: { type: integer, minimum: -2, maximum: 2 }
      responses:
        "204": { description: Updated }

  /parent/playback:
    get:
      operationId: listActivePlayback
      tags: [child-activity]
      summary: Long-poll the videos children are currently watching
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: Return immediately when omitted; otherwise wait for the active set to change.
      responses:
        "200":
          description: Current playback snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPage" }

  /parent/children/{childId}/video-blocks:
    parameters:
      - $ref: "#/components/parameters/ChildId"
    get:
      operationId: listVideoBlocks
      tags: [allowlist]
      summary: Videos explicitly hidden from this child
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoBlock" }

  /parent/children/{childId}/video-blocks/{videoId}:
    parameters:
      - $ref: "#/components/parameters/ChildId"
      - $ref: "#/components/parameters/VideoId"
    put:
      operationId: blockVideoForChild
      tags: [allowlist]
      summary: Hide one video even when its channel is approved
      responses:
        "204": { description: Blocked }
    delete:
      operationId: unblockVideoForChild
      tags: [allowlist]
      summary: Restore normal policy for one video
      responses:
        "204": { description: Unblocked }
        "404": { $ref: "#/components/responses/NotFound" }

  # Pairing ------------------------------------------------------------------

  /parent/children/{childId}/pairing-code:
    parameters:
      - $ref: "#/components/parameters/ChildId"
    post:
      operationId: createPairingCode
      tags: [pairing]
      summary: Mint a single-use pairing code for a child device
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingCode" }
        "404": { $ref: "#/components/responses/NotFound" }

  /parent/children/{childId}/web-links/{linkId}/approve:
    parameters:
      - $ref: "#/components/parameters/ChildId"
      - $ref: "#/components/parameters/LinkId"
    post:
      operationId: approveWebLinkAsParent
      tags: [pairing]
      summary: Approve a browser link for a child visible to this parent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebLinkApproval" }
      responses:
        "204": { description: Approved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /parent/children/{childId}/devices:
    parameters:
      - $ref: "#/components/parameters/ChildId"
    get:
      operationId: listChildDevices
      tags: [pairing]
      summary: List a child's paired devices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }

  /parent/devices:
    get:
      operationId: listFamilyDevices
      tags: [pairing]
      summary: List every installed client in the family and the build it reports
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FamilyDevice" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeChildDevice
      tags: [pairing]
      summary: Revoke a paired device
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateChildDevice
      tags: [pairing]
      summary: Update controls for a paired device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowSelfUnpair]
              properties:
                allowSelfUnpair: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "404": { $ref: "#/components/responses/NotFound" }

  # Allowlists ---------------------------------------------------------------

  /parent/allowlist/global:
    get:
      operationId: getGlobalAllowlist
      tags: [allowlist]
      summary: Channels approved for every child
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApprovedChannel" }
    put:
      operationId: allowChannelGlobally
      tags: [allowlist]
      summary: Approve a channel for every child
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId: { $ref: "#/components/schemas/ChannelId" }
      responses:
        "204": { description: Approved }

  /parent/allowlist/global/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    delete:
      operationId: disallowChannelGlobally
      tags: [allowlist]
      summary: Remove a channel from the global allowlist
      responses:
        "204": { description: Removed }

  /parent/children/{childId}/allowlist:
    parameters:
      - $ref: "#/components/parameters/ChildId"
    get:
      operationId: getChildAllowlist
      tags: [allowlist]
      summary: Channels this child may watch, with the reason for each
      description: |
        Effective state, not a raw table read. Each entry reports whether it
        came from the global list or this child's own list, and whether a
        per-child denial is subtracting it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EffectiveChannel" }
    put:
      operationId: allowChannelForChild
      tags: [allowlist]
      summary: Approve a channel for this child only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId: { $ref: "#/components/schemas/ChannelId" }
      responses:
        "204": { description: Approved }

  /parent/children/{childId}/allowlist/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChildId"
      - $ref: "#/components/parameters/ChannelId"
    delete:
      operationId: disallowChannelForChild
      tags: [allowlist]
      summary: Remove a channel from this child's own allowlist
      responses:
        "204": { description: Removed }

  /parent/children/{childId}/denylist/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChildId"
      - $ref: "#/components/parameters/ChannelId"
    put:
      operationId: denyChannelForChild
      tags: [allowlist]
      summary: Subtract a globally approved channel from this child
      responses:
        "204": { description: Denied }
    delete:
      operationId: removeChildChannelDenial
      tags: [allowlist]
      summary: Remove the per-child denial
      responses:
        "204": { description: Removed }

  /parent/blocklist:
    get:
      operationId: getChannelBlocklist
      tags: [allowlist]
      summary: Channels hidden family-wide
      description: Blocked channels are invisible to children and cannot be requested.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockedChannel" }
    put:
      operationId: blockChannel
      tags: [allowlist]
      summary: Block a channel family-wide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId: { $ref: "#/components/schemas/ChannelId" }
                reason: { type: string }
      responses:
        "204": { description: Blocked }

  /parent/blocklist/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    delete:
      operationId: unblockChannel
      tags: [allowlist]
      summary: Unblock a channel
      responses:
        "204": { description: Unblocked }

  # Keywords -----------------------------------------------------------------

  /parent/keywords:
    get:
      operationId: listKeywords
      tags: [keywords]
      summary: List negative keywords
      parameters:
        - name: childId
          in: query
          description: Omit for family-wide keywords only.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Keyword" }
    post:
      operationId: createKeyword
      tags: [keywords]
      summary: Create a negative keyword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeywordInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Keyword" }

  /parent/keywords/{keywordId}:
    parameters:
      - name: keywordId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateKeyword
      tags: [keywords]
      summary: Update a keyword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeywordInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Keyword" }
    delete:
      operationId: deleteKeyword
      tags: [keywords]
      summary: Delete a keyword
      responses:
        "204": { description: Deleted }

  # Requests -----------------------------------------------------------------

  /parent/requests:
    get:
      operationId: listParentRequests
      tags: [requests]
      summary: Requests raised by children in scope
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RequestStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPage" }

  /parent/requests/{requestId}/approve:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: approveRequest
      tags: [requests]
      summary: Approve a request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  description: Approve for this child only, or for everyone.
                  type: string
                  enum: [child, global]
                  default: child
                note: { type: string }
      responses:
        "204": { description: Approved }
        "404": { $ref: "#/components/responses/NotFound" }

  /parent/requests/{requestId}/deny:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: denyRequest
      tags: [requests]
      summary: Deny a request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                block:
                  description: Also block the channel family-wide.
                  type: boolean
                  default: false
      responses:
        "204": { description: Denied }
        "404": { $ref: "#/components/responses/NotFound" }

  # Push notifications -------------------------------------------------------

  /parent/push-token:
    put:
      operationId: saveParentPushToken
      tags: [requests]
      summary: Register this device for request notifications
      description: |
        Accepted even when the server has APNs delivery disabled, so enabling
        it later needs no re-registration from installed apps.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushTokenBody" }
      responses:
        "204": { description: Registered }

  /parent/push-token/{token}:
    delete:
      operationId: deleteParentPushToken
      tags: [requests]
      summary: Unregister this device at sign-out
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Unregistered }

  # Suppressions -------------------------------------------------------------

  /parent/children/{childId}/suppressions:
    parameters:
      - $ref: "#/components/parameters/ChildId"
    get:
      operationId: listSuppressions
      tags: [suppressions]
      summary: Videos a keyword hid from this child
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuppressionPage" }

  /parent/suppressions/{suppressionId}/override:
    parameters:
      - name: suppressionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: overrideSuppression
      tags: [suppressions]
      summary: Allow the suppressed video after all
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum: [child, family]
                  default: child
      responses:
        "204": { description: Overridden }
        "404": { $ref: "#/components/responses/NotFound" }

  # Parent-side channel search -----------------------------------------------

  /parent/search/channels:
    get:
      operationId: searchChannelsForParent
      tags: [allowlist]
      summary: Find channels to approve
      description: |
        Spends from the family's search budget, which Google meters separately
        at 100 calls per day per project. Results are cached for 24 hours by
        normalized query, so repeating a search is free.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
        "429":
          description: The daily search budget is exhausted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # Child surface ------------------------------------------------------------

  /web/link:
    post:
      operationId: createWebDeviceLink
      tags: [child-session]
      summary: Create a short-lived browser device handoff
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceName]
              properties:
                deviceName: { type: string, maxLength: 80 }
      responses:
        "201":
          description: Created
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebDeviceLink" }
        "400":
          description: The device name is invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many browser links were created from this address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /web/link/{linkId}:
    parameters:
      - $ref: "#/components/parameters/LinkId"
      - $ref: "#/components/parameters/WebLinkSecret"
    get:
      operationId: getWebDeviceLink
      tags: [child-session]
      summary: Poll browser link approval using the browser-only secret
      security: []
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebDeviceLinkStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /web/link/{linkId}/redeem:
    parameters:
      - $ref: "#/components/parameters/LinkId"
      - $ref: "#/components/parameters/WebLinkSecret"
    post:
      operationId: redeemWebDeviceLink
      tags: [child-session]
      summary: Exchange an approved handoff for an HttpOnly browser session
      security: []
      responses:
        "200":
          description: Linked
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /web/pair:
    post:
      operationId: pairWebDevice
      tags: [child-session]
      summary: Use a parent's single-use pairing code as the browser fallback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, deviceName]
              properties:
                code: { type: string }
                deviceName: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Paired
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildProfile" }
        "400":
          description: The code is unknown, expired, or already used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /child/pair:
    post:
      operationId: pairChildDevice
      tags: [child-session]
      summary: Redeem a pairing code for a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, deviceName]
              properties:
                code: { type: string }
                deviceName: { type: string }
      responses:
        "200":
          description: Paired
          content:
            application/json:
              schema:
                type: object
                required: [token, child]
                properties:
                  token: { type: string }
                  child: { $ref: "#/components/schemas/ChildProfile" }
        "400":
          description: The code is unknown, expired, or already used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /child/me:
    get:
      operationId: getChildProfile
      tags: [child-session]
      summary: The paired child's profile and enabled surfaces
      security:
        - childToken: []
        - webChildSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /child/web-links/{linkId}/approve:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    post:
      operationId: approveWebLinkAsChild
      tags: [child-session]
      summary: Approve a browser link for this paired child's profile
      security:
        - childToken: []
        - webChildSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebLinkApproval" }
      responses:
        "204": { description: Approved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /child/session:
    delete:
      operationId: endChildWebSession
      tags: [child-session]
      summary: Revoke the current browser device and clear its cookie
      security:
        - webChildSession: []
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /child/feed:
    get:
      operationId: getChildFeed
      tags: [child-browse]
      summary: Ranked home feed across subscribed and allowed channels
      description: |
        Locally ranked with seeded exploration, so the order varies between
        visits. The cursor continues its own visit's order, and each fresh
        first page draws a new one.
      security:
        - childToken: []
        - webChildSession: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoPage" }

  /child/discovery:
    get:
      operationId: getChildDiscovery
      tags: [child-browse]
      summary: Locked videos from requestable channels that match this child
      description: |
        Returns nothing unless a parent enables channel discovery for this
        child. Results are cached, exclude approved and blocked channels,
        pass live, video-block, and keyword policy, and can never be played
        before their channel is approved.
      security:
        - childToken: []
        - webChildSession: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 12, default: 4 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryPage" }

  /child/shorts:
    get:
      operationId: getChildShorts
      tags: [child-browse]
      summary: Shorts feed
      description: |
        Allowed channels only, with no locked entries. The feed shuffles per
        session and wraps rather than dead-ending when the pool is exhausted.
      security:
        - childToken: []
        - webChildSession: []
      parameters:
        - name: session
          in: query
          description: Stable shuffle seed for one browsing session.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoPage" }
        "404":
          description: The Shorts surface is disabled for this child
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /child/subscriptions:
    get:
      operationId: listChildSubscriptions
      tags: [child-browse]
      summary: Channels this child subscribes to
      security:
        - childToken: []
        - webChildSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }

  /child/subscriptions/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    put:
      operationId: subscribeToChannel
      tags: [child-browse]
      summary: Subscribe. Local to Coop, never written to YouTube
      security:
        - childToken: []
        - webChildSession: []
      responses:
        "204": { description: Subscribed }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unsubscribeFromChannel
      tags: [child-browse]
      summary: Unsubscribe
      security:
        - childToken: []
        - webChildSession: []
      responses:
        "204": { description: Unsubscribed }

  /child/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getChildChannel
      tags: [child-browse]
      summary: A channel page
      description: |
        A requestable channel returns its branding with an empty video list, so
        the child can see what they are asking for. A blocked channel returns
        404, giving no signal that it exists.
      security:
        - childToken: []
        - webChildSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /child/search:
    get:
      operationId: searchForChild
      tags: [child-browse]
      summary: Search channels and videos
      description: |
        Results from channels that are not yet allowed are marked `locked` so
        the client can render an ask affordance rather than a dead end. Blocked
        channels never appear. Non-embeddable and live videos are omitted.
      security:
        - childToken: []
        - webChildSession: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: channelId
          in: query
          required: false
          description: Restrict video results to this channel.
          schema: { $ref: "#/components/schemas/ChannelId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "429":
          description: The search budget for this child or family is exhausted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /child/videos/{videoId}:
    parameters:
      - $ref: "#/components/parameters/VideoId"
    get:
      operationId: getChildVideo
      tags: [child-browse]
      summary: Watch page data, including the embed URL
      security:
        - childToken: []
        - webChildSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /child/videos/{videoId}/channel:
    parameters:
      - $ref: "#/components/parameters/VideoId"
    get:
      operationId: locateVideoChannel
      tags: [child-browse]
      summary: The channel behind a tapped video, for the ask flow
      description: |
        Resolves a video the child tapped inside the player to its channel so
        an unwatchable link can land on the channel page and its request
        affordance. Videos on blocked channels read as not found.
      security:
        - childToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [channelId]
                properties:
                  channelId: { $ref: "#/components/schemas/ChannelId" }
        "404": { $ref: "#/components/responses/NotFound" }

  /child/videos/{videoId}/reaction:
    parameters:
      - $ref: "#/components/parameters/VideoId"
    put:
      operationId: setVideoReaction
      tags: [child-activity]
      summary: Record a local like or dislike
      security:
        - childToken: []
        - webChildSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [like, dislike] }
      responses:
        "204": { description: Recorded }
    delete:
      operationId: clearVideoReaction
      tags: [child-activity]
      summary: Clear the reaction
      security:
        - childToken: []
        - webChildSession: []
      responses:
        "204": { description: Cleared }

  /child/videos/{videoId}/watch:
    parameters:
      - $ref: "#/components/parameters/VideoId"
    post:
      operationId: recordVideoWatch
      tags: [child-activity]
      summary: Report watch progress
      description: Completion, not starts, is what the ranker weighs.
      security:
        - childToken: []
        - webChildSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startedAt, secondsWatched]
              properties:
                startedAt: { type: string, format: date-time }
                secondsWatched: { type: integer, minimum: 0 }
      responses:
        "204": { description: Recorded }

  /child/playback:
    put:
      operationId: updatePlaybackLease
      tags: [child-activity]
      summary: Start, renew, or stop the child's current playback lease
      security:
        - childToken: []
        - webChildSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [videoId, state]
              properties:
                videoId: { type: string }
                state: { type: string, enum: [started, heartbeat, stopped] }
      responses:
        "200":
          description: Whether policy still allows playback
          content:
            application/json:
              schema:
                type: object
                required: [allowed]
                properties:
                  allowed: { type: boolean }

  /child/push-token:
    put:
      operationId: saveChildPushToken
      tags: [child-activity]
      summary: Register this paired device for decision notifications
      description: |
        Native devices only, since browsers cannot receive APNs. The
        registration dies with the device pairing.
      security:
        - childToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushTokenBody" }
      responses:
        "204": { description: Registered }

  /child/requests:
    get:
      operationId: listChildRequests
      tags: [child-activity]
      summary: This child's own requests and their outcomes
      security:
        - childToken: []
        - webChildSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Request" }
    post:
      operationId: createChildRequest
      tags: [child-activity]
      summary: Ask for a channel
      description: |
        Re-asking for a channel that already has an open request updates that
        request rather than creating a duplicate in the parent's queue.
      security:
        - childToken: []
        - webChildSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId: { $ref: "#/components/schemas/ChannelId" }
                promptedByVideoId: { type: string }
      responses:
        "201":
          description: Raised
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    parentSession:
      type: http
      scheme: bearer
      description: A parent session token from the login flow.
    childToken:
      type: http
      scheme: bearer
      description: |
        A device token from pairing. Scoped to one child, read-mostly, and
        revocable from the parent app.
    webChildSession:
      type: apiKey
      in: cookie
      name: __Host-coop-child
      description: A Secure, HttpOnly, SameSite=Strict browser device session.

  parameters:
    ChildId:
      name: childId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ParentId:
      name: parentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ChannelId" }
    VideoId:
      name: videoId
      in: path
      required: true
      schema: { type: string }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkId:
      name: linkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebLinkSecret:
      name: X-Coop-Link-Secret
      in: header
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        No such resource, or it is outside the caller's scope. Scope failures
        are reported as 404 so the response does not confirm existence.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    ChannelId:
      type: string
      description: A YouTube channel ID.
      pattern: "^UC[A-Za-z0-9_-]{22}$"

    PushTokenBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The hexadecimal APNs device token.
          minLength: 1
          maxLength: 512

    RequestStatus:
      type: string
      enum: [pending, approved, denied]

    ChannelState:
      type: string
      description: |
        Effective visibility of a channel for one child. Blocked never appears
        on the child surface at all.
      enum: [allowed, requestable, blocked]

    SetupStatus:
      type: object
      required: [needsSetup]
      properties:
        needsSetup: { type: boolean }
        updates:
          $ref: "#/components/schemas/UpdateSource"

    UpdateSource:
      type: object
      description: >
        Where over-the-air releases live. Absent when the server publishes none,
        which a client reads as "do not check" rather than as an error. Supplied
        by the server so a client needs only one address, and so the
        distribution server can move without rebuilding the applications.
      required: [baseUrl, parentBundleId, childBundleId]
      properties:
        baseUrl: { type: string }
        parentBundleId: { type: string }
        childBundleId: { type: string }

    SetupRequest:
      type: object
      required: [familyName, email, password]
      properties:
        familyName: { type: string }
        timezone: { type: string, default: UTC }
        email: { type: string, format: email }
        password: { type: string, format: password }

    Session:
      type: object
      required: [token, expiresAt, parent]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        parent: { $ref: "#/components/schemas/Parent" }

    AuthChallenge:
      type: object
      required: [challenge, expiresAt, method]
      properties:
        challenge: { type: string }
        expiresAt: { type: string, format: date-time }
        method: { type: string, enum: [totp] }
        enrollment:
          $ref: "#/components/schemas/TOTPEnrollment"

    TOTPEnrollment:
      type: object
      required: [secret, provisioningUrl]
      properties:
        secret: { type: string }
        provisioningUrl: { type: string, format: uri }

    AuditEvent:
      type: object
      required: [id, action, targetType, targetId, before, after, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorParentId: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    Parent:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, parent] }
        totpEnrolled: { type: boolean }
        scopedChildIds:
          type: array
          description: Empty for admins, who see every child.
          items: { type: string, format: uuid }

    Invitation:
      type: object
      required: [code, email, role, childIds, expiresAt]
      properties:
        code: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, parent] }
        childIds:
          type: array
          items: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }

    Family:
      type: object
      required: [id, name, timezone, apiKeyConfigured]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        apiKeyConfigured: { type: boolean }

    QuotaStatus:
      type: object
      required: [purpose, used, budget]
      properties:
        purpose: { type: string, enum: [feed, search, backfill] }
        used: { type: integer }
        budget: { type: integer }
        resetsAt: { type: string, format: date-time }

    ChildSettings:
      type: object
      properties:
        name: { type: string }
        avatarId: { type: string }
        shortsEnabled: { type: boolean }
        watchPageAutoplay:
          type: boolean
          description: |
            Deprecated compatibility field. Watch pages now always autoplay.
        videoSearchTiles:
          type: boolean
          description: Whether search returns videos as well as channels.
        channelDiscoveryEnabled:
          type: boolean
          description: |
            Whether policy-filtered videos from requestable channels may
            appear as locked discovery suggestions.
        webLinkingEnabled:
          type: boolean
          description: Whether this child may link a browser as a paired device.
        dailySearchLimit:
          type: integer
          description: Zero means no per-child limit beyond the family budget.
          minimum: 0

    Child:
      allOf:
        - type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            deviceCount: { type: integer }
            pendingRequestCount: { type: integer }
        - $ref: "#/components/schemas/ChildSettings"

    ChildProfile:
      type: object
      required:
        - id
        - name
        - shortsEnabled
        - watchPageAutoplay
        - channelDiscoveryEnabled
        - webLinkingEnabled
        - allowSelfUnpair
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatarId: { type: string }
        shortsEnabled: { type: boolean }
        watchPageAutoplay: { type: boolean }
        videoSearchTiles: { type: boolean }
        channelDiscoveryEnabled: { type: boolean }
        webLinkingEnabled: { type: boolean }
        allowSelfUnpair: { type: boolean }

    PairingCode:
      type: object
      required: [code, expiresAt, pairingUrl]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
        pairingUrl:
          type: string
          description: Encoded into a QR code. Embeds the server's public URL.

    WebDeviceLink:
      type: object
      required: [id, approvalToken, redemptionToken, expiresAt, qrPayload]
      properties:
        id: { type: string, format: uuid }
        approvalToken: { type: string }
        redemptionToken: { type: string }
        expiresAt: { type: string, format: date-time }
        qrPayload: { type: string }

    WebDeviceLinkStatus:
      type: object
      required: [approved, expiresAt]
      properties:
        approved: { type: boolean }
        expiresAt: { type: string, format: date-time }

    WebLinkApproval:
      type: object
      required: [approvalToken]
      properties:
        approvalToken: { type: string }

    Device:
      type: object
      required: [id, name, createdAt, allowSelfUnpair]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        allowSelfUnpair: { type: boolean }
        appBuild: { type: string }
        appVersion: { type: string }

    FamilyDevice:
      type: object
      description: >
        One installed client, either a signed-in parent session or a paired
        child device. An absent appBuild means the client predates version
        reporting, which is how a device still awaiting an update is spotted.
      required: [id, audience, owner, createdAt, current]
      properties:
        id: { type: string, format: uuid }
        audience: { type: string, enum: [parent, child] }
        owner:
          type: string
          description: The parent's email address, or the child's name.
        name:
          type: string
          description: The device name. Absent for parent sessions, which have none.
        appBuild: { type: string }
        appVersion: { type: string }
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        current:
          type: boolean
          description: True for the session this request arrived on.

    Channel:
      type: object
      required: [id, title]
      properties:
        id: { $ref: "#/components/schemas/ChannelId" }
        title: { type: string }
        description: { type: string }
        thumbnailUrl: { type: string }
        bannerUrl: { type: string }
        subscriberCount: { type: integer, format: int64 }
        youtubeUrl:
          type: string
          description: Canonical channel URL for parent review.

    ApprovedChannel:
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          properties:
            approvedAt: { type: string, format: date-time }
            approvedBy: { type: string, format: uuid }
            youtubeUrl:
              type: string
              description: |
                Opens the real YouTube app so a parent can review what they
                approved.

    EffectiveChannel:
      allOf:
        - $ref: "#/components/schemas/ApprovedChannel"
        - type: object
          required: [source]
          properties:
            source:
              type: string
              description: Which list put this channel in reach of the child.
              enum: [global, child]
            deniedForChild:
              type: boolean
              description: A per-child denial subtracting a globally approved channel.

    BlockedChannel:
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          properties:
            reason: { type: string }
            blockedAt: { type: string, format: date-time }

    Video:
      type: object
      required: [id, channelId, title, isShort]
      properties:
        id: { type: string }
        channelId: { $ref: "#/components/schemas/ChannelId" }
        channelTitle: { type: string }
        title: { type: string }
        thumbnailUrl:
          type: string
          description: Served through this instance, not from a Google host.
        durationSeconds: { type: integer }
        publishedAt: { type: string, format: date-time }
        isShort: { type: boolean }
        locked:
          type: boolean
          description: |
            The video belongs to a requestable channel. Present on search and
            discovery results, never on the approved feed or Shorts feed.

    RecommendationReasonKind:
      type: string
      enum:
        - liked
        - disliked
        - parent_more
        - parent_less
        - rewatched
        - completed
        - channel_satisfaction
        - new_subscription
        - unwatched
        - recent

    Recommendation:
      type: object
      required: [video, score, reason, reasonKind]
      properties:
        video: { $ref: "#/components/schemas/Video" }
        score: { type: number, format: double }
        reason: { type: string }
        reasonKind: { $ref: "#/components/schemas/RecommendationReasonKind" }

    RecommendationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        nextCursor: { type: string }

    Discovery:
      type: object
      required: [video, reason, pendingRequest]
      properties:
        video: { $ref: "#/components/schemas/Video" }
        reason:
          type: string
          description: Child-facing explanation of the preference signal.
        pendingRequest:
          type: boolean
          description: Whether this channel is already waiting for a parent.

    DiscoveryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Discovery" }

    ChannelWeight:
      type: object
      required: [channelId, weight]
      properties:
        channelId: { $ref: "#/components/schemas/ChannelId" }
        weight: { type: integer, minimum: -2, maximum: 2 }

    ChannelPage:
      type: object
      required: [channel, state, subscribed, videos]
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
        state: { $ref: "#/components/schemas/ChannelState" }
        subscribed: { type: boolean }
        pendingRequest: { type: boolean }
        videos:
          type: array
          description: Empty for a requestable channel.
          items: { $ref: "#/components/schemas/Video" }

    WatchPage:
      type: object
      required: [video, embedUrl, autoplay]
      properties:
        video: { $ref: "#/components/schemas/Video" }
        embedUrl:
          type: string
          description: |
            A youtube-nocookie.com embed URL. Tracking is disabled for videos
            YouTube designates Made For Kids.
        autoplay:
          type: boolean
          description: Always true; retained explicitly as part of the playback contract.
        reaction:
          type: string
          enum: [like, dislike]
        shareUrl:
          type: string
          description: A canonical youtube.com link, for sharing out.

    Playback:
      type: object
      required: [childId, childName, deviceId, deviceName, video, startedAt]
      properties:
        childId: { type: string, format: uuid }
        childName: { type: string }
        deviceId: { type: string, format: uuid }
        deviceName: { type: string }
        video: { $ref: "#/components/schemas/Video" }
        startedAt: { type: string, format: date-time }

    PlaybackPage:
      type: object
      required: [items, cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Playback" }
        cursor: { type: string }

    VideoBlock:
      type: object
      required: [video, createdAt]
      properties:
        video: { $ref: "#/components/schemas/Video" }
        createdAt: { type: string, format: date-time }

    SearchResults:
      type: object
      required: [channels, videos]
      properties:
        channels:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Channel"
              - type: object
                required: [state]
                properties:
                  state: { $ref: "#/components/schemas/ChannelState" }
                  pendingRequest: { type: boolean }
        videos:
          type: array
          description: Empty when videoSearchTiles is off for this child.
          items: { $ref: "#/components/schemas/Video" }

    Keyword:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - $ref: "#/components/schemas/KeywordInput"

    KeywordInput:
      type: object
      required: [term]
      properties:
        term: { type: string, minLength: 1 }
        childId:
          type: string
          format: uuid
          description: Omit for a family-wide keyword. Per-child keywords add to those.
        matchTitle: { type: boolean, default: true }
        matchTags: { type: boolean, default: true }
        matchDescription:
          type: boolean
          default: false
          description: |
            Off by default. Descriptions carry sponsor copy and boilerplate, so
            matching them false-positives hard.
        wholeWord:
          type: boolean
          default: true
          description: Whole-word matching avoids blocking "gun" and killing "begun".

    Request:
      type: object
      required: [id, childId, channel, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        childName: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        promptedByVideo: { $ref: "#/components/schemas/Video" }
        status: { $ref: "#/components/schemas/RequestStatus" }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decidedByName: { type: string }

    Suppression:
      type: object
      required: [id, video, term, createdAt]
      properties:
        id: { type: string, format: uuid }
        video: { $ref: "#/components/schemas/Video" }
        term: { type: string }
        matchedField: { type: string, enum: [title, tags, description] }
        createdAt: { type: string, format: date-time }

    VideoPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Video" }
        nextCursor: { type: string }

    RequestPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Request" }
        nextCursor: { type: string }

    SuppressionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Suppression" }
        nextCursor: { type: string }
