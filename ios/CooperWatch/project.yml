name: CooperWatch

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"

packages:
  CoopKit:
    path: ../CoopKit

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CooperWatch:
    type: application
    platform: iOS
    sources:
      - App
      - DesignSystem
      - Features
      - Resources
    # Development here is correct for every build: distribution signing
    # rewrites aps-environment to production from the provisioning profile.
    entitlements:
      path: CooperWatch.entitlements
      properties:
        aps-environment: development
    dependencies:
      - package: CoopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fish.nerdswhofish.coop.child
        PRODUCT_NAME: CooperWatch
        # Both are written by scripts/release-version.sh; do not hand-edit.
        MARKETING_VERSION: 1.8.1
        CURRENT_PROJECT_VERSION: 1080199
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Cooper Watch
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a Coop code to link a computer to this profile.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - CooperWatchTests
        - CooperWatchUITests

  CooperWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../CooperWatchTests
    dependencies:
      - target: CooperWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fish.nerdswhofish.coop.child.tests
        GENERATE_INFOPLIST_FILE: "YES"

  CooperWatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../CooperWatchUITests
    dependencies:
      - target: CooperWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fish.nerdswhofish.coop.child.ui-tests
        GENERATE_INFOPLIST_FILE: "YES"
