name: CooperWatch

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"

packages:
  CoopKit:
    path: ../CoopKit

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CooperWatch:
    type: application
    platform: iOS
    sources:
      - App
      - DesignSystem
      - Features
      - Resources
    dependencies:
      - package: CoopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fish.nerdswhofish.coop.child
        PRODUCT_NAME: CooperWatch
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Cooper Watch
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - CooperWatchTests
        - CooperWatchUITests

  CooperWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../CooperWatchTests
    dependencies:
      - target: CooperWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fish.nerdswhofish.coop.child.tests
        GENERATE_INFOPLIST_FILE: "YES"

  CooperWatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../CooperWatchUITests
    dependencies:
      - target: CooperWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fish.nerdswhofish.coop.child.ui-tests
        GENERATE_INFOPLIST_FILE: "YES"
