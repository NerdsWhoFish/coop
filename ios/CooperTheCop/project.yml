name: CooperTheCop

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"

packages:
  CoopKit:
    path: ../CoopKit

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CooperTheCop:
    type: application
    platform: iOS
    sources:
      - App
      - DesignSystem
      - Features
      - Resources
    # Development here is correct for every build: distribution signing
    # rewrites aps-environment to production from the provisioning profile.
    entitlements:
      path: CooperTheCop.entitlements
      properties:
        aps-environment: development
    dependencies:
      - package: CoopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fish.nerdswhofish.coop.parent
        PRODUCT_NAME: CooperTheCop
        # Both are written by scripts/release-version.sh; do not hand-edit.
        MARKETING_VERSION: 1.8.1
        CURRENT_PROJECT_VERSION: 1080199
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Cooper The Cop
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a Coop code to approve a child computer.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - CooperTheCopTests
        - CooperTheCopUITests

  CooperTheCopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../CooperTheCopTests
    dependencies:
      - target: CooperTheCop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fish.nerdswhofish.coop.parent.tests
        GENERATE_INFOPLIST_FILE: "YES"

  CooperTheCopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../CooperTheCopUITests
    dependencies:
      - target: CooperTheCop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fish.nerdswhofish.coop.parent.ui-tests
        GENERATE_INFOPLIST_FILE: "YES"
