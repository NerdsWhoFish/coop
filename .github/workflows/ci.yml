---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -shuffle=on ./...

  schema:
    name: Migrations and model mapping
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coop
          POSTGRES_PASSWORD: coop
          POSTGRES_DB: coop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Proves the schema is valid SQL, that it rolls back, and that every GORM
      # model maps to a table and columns the migrations actually create.
      - name: Integration tests
        env:
          COOP_TEST_DATABASE_DSN: postgres://coop:coop@localhost:5432/coop?sslmode=disable
        run: go test -race -tags=integration ./internal/store/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -c .yamllint.yml .

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the spec
        run: |
          npx --yes @redocly/cli@latest lint api/openapi.yaml \
            --skip-rule no-empty-servers \
            --skip-rule operation-4xx-response

  ios:
    name: Parent app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test CoopKit
        run: swift test --package-path ios/CoopKit

      - name: Generate the project
        run: xcodegen generate --spec ios/CooperTheCop/project.yml

      - name: Build the parent app
        run: |
          xcodebuild -quiet \
            -project ios/CooperTheCop/CooperTheCop.xcodeproj \
            -scheme CooperTheCop \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO
