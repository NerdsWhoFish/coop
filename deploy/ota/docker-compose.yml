name: coop-ota

services:
  nginx:
    image: nginx@sha256:8b1e78743a03dbb2c95171cc58639fef29abc8816598e27fb910ed2e621e589a
    container_name: coop-ota
    restart: unless-stopped
    ports:
      - "${COOP_OTA_HTTP_PORT:-8081}:80"
      - "${COOP_OTA_HTTPS_PORT:-8444}:443"
    volumes:
      - ../../.build/ota/site:/usr/share/nginx/html:ro
      - ../../.build/ota/certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
