apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coop.fullname" . }}
  labels:
    {{- include "coop.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "coop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "coop.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "coop.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: coop
          image: {{ include "coop.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: COOP_SERVER_ADDR
              value: :8080
            - name: COOP_PUBLIC_URL
              value: {{ .Values.config.publicURL | quote }}
            - name: COOP_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: COOP_LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: COOP_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: {{ .Values.config.databaseDSNKey }}
            - name: COOP_AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: {{ .Values.config.authEncryptionKeyKey }}
            {{- if .Values.ota.enabled }}
            - name: COOP_OTA_ENABLED
              value: "true"
            - name: COOP_OTA_DIRECTORY
              value: {{ .Values.ota.mountPath | quote }}
            {{- end }}
            {{- if .Values.apns.enabled }}
            - name: COOP_APNS_ENABLED
              value: "true"
            - name: COOP_APNS_KEY_ID
              value: {{ .Values.apns.keyID | quote }}
            - name: COOP_APNS_TEAM_ID
              value: {{ .Values.apns.teamID | quote }}
            - name: COOP_APNS_ENVIRONMENT
              value: {{ .Values.apns.environment | quote }}
            - name: COOP_APNS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: {{ .Values.apns.keySecretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.ota.enabled }}
          volumeMounts:
            - name: ota-packages
              mountPath: {{ .Values.ota.mountPath | quote }}
          {{- end }}
      {{- if .Values.ota.enabled }}
      volumes:
        - name: ota-packages
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-ota" (include "coop.fullname" .)) .Values.ota.persistence.existingClaim }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
